<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produse populare</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="m-0 p-4 d-flex flex-column align-items-center">
  <h1 class="text-center fw-bold">Produse populare</h1>

  <!-- Clasele Bootstrap aranjează și centrează cardurile. -->
  <main class="container product-container d-flex flex-wrap justify-content-center align-items-center p-4 w-100">
    <article class="card product-card p-3 text-center bg-white">
      <img class="w-100 object-fit-contain product-image" src="ps5.jpg" alt="Playstation 5 cu un controller">
      <h2 class="card-title fs-5 fw-bold">Playstation 5</h2>
      <p class="pret fw-bold">50 000 lei</p>
      <button class="btn btn-danger w-100" type="button">BUY</button>
    </article>

    <article class="card product-card p-3 text-center bg-white">
      <img class="w-100 object-fit-contain product-image" src="iphoneduo.webp" alt="Telefon pliabil Iphone Duo">
      <h2 class="card-title fs-5 fw-bold">Iphone Duo</h2>
      <p class="pret fw-bold">300 000 lei</p>
      <button class="btn btn-danger w-100" type="button">BUY</button>
    </article>

    <article class="card product-card p-3 text-center bg-white">
      <img class="w-100 object-fit-contain product-image" src="xbox.png" alt="Consolă Xbox cu un controller">
      <h2 class="card-title fs-5 fw-bold">XBOX series S</h2>
      <p class="pret fw-bold">49 999 lei</p>
      <button class="btn btn-danger w-100" type="button">BUY</button>
    </article>
  </main>
</body>
</html>
