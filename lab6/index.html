<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produse populare</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="m-0 p-4 d-flex flex-column align-items-center">
  <h1 class="text-center">Produse populare</h1>

  <!-- Clasele Bootstrap aranjează și centrează cardurile. -->
  <main class="container d-flex flex-wrap justify-content-center align-items-center p-4 w-100">
    <article class="card d-flex flex-column p-3 text-center">
      <img class="w-100" src="ps5.jpg" alt="Playstation 5 cu un controller">
      <h2>Playstation 5</h2>
      <p class="pret">50 000 lei</p>
      <button class="w-100" type="button">BUY</button>
    </article>

    <article class="card d-flex flex-column p-3 text-center">
      <img class="w-100" src="iphoneduo.webp" alt="Telefon pliabil Iphone Duo">
      <h2>Iphone Duo</h2>
      <p class="pret">300 000 lei</p>
      <button class="w-100" type="button">BUY</button>
    </article>

    <article class="card d-flex flex-column p-3 text-center">
      <img class="w-100" src="xbox.png" alt="Consolă Xbox cu un controller">
      <h2>XBOX series S</h2>
      <p class="pret">49 999 lei</p>
      <button class="w-100" type="button">BUY</button>
    </article>
  </main>
</body>
</html>
